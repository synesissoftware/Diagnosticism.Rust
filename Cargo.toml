
# ##########################################################
# Package

[package]

authors = [
	"Matt Wilson <matthew@synesis.com.au>",
]
categories = [
	"development-tools::debugging",
	"development-tools::profiling",
]
description = "Miscellaneous discrete and simple diagnostics facilities (for Rust)"
documentation = "https://docs.rs/diagnosticism"
edition = "2021"
exclude = [
	".cargo",
	".cursor",
	".github",
	".vimrc",
	".vscode",
	"scripts",
	"target",
]
homepage = "https://github.com/synesissoftware/Diagnosticism.Rust"
keywords = [
	"debug",
	"diagnostics",
	"fmt",
	"logging",
	"profiling",
]
license = "BSD-3-Clause"
name = "diagnosticism"
readme = "README.md"
repository = "https://github.com/synesissoftware/Diagnosticism.Rust"
rust-version = "1.74"
version = "0.4.5"

# docs.rs builds the optional `rand`-backed example path.

[package.metadata.docs.rs]
features = [
	"test-doomgram",
]


# ##########################################################
# Targets

[lib]
name = "diagnosticism"
path = "src/lib.rs"

[[bench]]
name = "doomgram"
harness = false

[[bench]]
name = "time_format"
harness = false

[[example]]
name = "debug-squeezer"
path = "examples/debug_squeezer.rs"

[[example]]
name = "doomgram"
path = "examples/doomgram.rs"
required-features = [
	"test-doomgram",
]

[[example]]
name = "ellipsis"
path = "examples/ellipsis.rs"

[[example]]
name = "flf"
path = "examples/flf.rs"

[[example]]
name = "password"
path = "examples/password.rs"

[[example]]
name = "versions"
path = "examples/versions/main.rs"


# ##########################################################
# Features

[features]

default = [
]

# General features:
#
# - "_NEVER_TO_BE_ENABLED" - this is a placeholder feature and must NEVER be specified;
# - "null-feature" - a feature that has no effect (and, thus, is useful for simplifying driver scripts);

_NEVER_TO_BE_ENABLED = []
null-feature = []


# Crate-specific features:
#
# - "test-doomgram" - enables the doomgram example's `rand`-backed path;

test-doomgram = [
	"dep:rand",
]


# ##########################################################
# Dependencies

[build-dependencies]

[dependencies]

base-traits = { version = "0.1", default-features = false, features = [
]}
rand = { version = "0.10", optional = true, default-features = false, features = [
]}


[dev-dependencies]

criterion = { version = "0.8", default-features = false, features = [
]}


# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

